name: Promote Branch

on:
  workflow_dispatch:
    inputs:
      promotion:
        description: Which promotion to run
        required: true
        type: choice
        options:
          - develop → review
          - review → main
      bump:
        description: Version bump (develop → review only)
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  pull-requests: write
  contents: write

jobs:
  promote:
    name: Bump version and open promotion PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set promotion targets
        id: targets
        run: |
          if [ "${{ inputs.promotion }}" = "develop → review" ]; then
            echo "head=develop" >> "$GITHUB_OUTPUT"
            echo "base=review" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "head=review" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.targets.outputs.bump == 'true'
        id: bump
        run: |
          current=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_version="$major.$minor.$patch"
          echo "$new_version" > VERSION
          cd frontend && npm version "$new_version" --no-git-tag-version --allow-same-version
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/package.json
          git commit -m "chore: bump version to $new_version"
          git push origin develop

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Create promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.targets.outputs.head }}
          BASE: ${{ steps.targets.outputs.base }}
        run: |
          existing=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open — nothing to do"
            gh pr view "$existing"
            exit 0
          fi

          DATE=$(date -u '+%Y-%m-%d')

          if [ "${{ steps.targets.outputs.bump }}" = "true" ]; then
            TITLE="Promote $HEAD → $BASE — v${{ steps.bump.outputs.new_version }} ($DATE)"
          else
            TITLE="Promote $HEAD → $BASE ($DATE)"
          fi

          gh pr create \
            --base "$BASE" \
            --head "$HEAD" \
            --title "$TITLE" \
            --body "Triggered manually from the Actions tab. Merge when all status checks pass."
