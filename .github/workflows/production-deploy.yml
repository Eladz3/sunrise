name: Production Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'SunriseApi/**'

  frontend-build:
    name: Frontend Build & Artifact
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 30

  backend-deploy:
    name: Backend Deploy
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: SunriseApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore
      - name: Publish
        run: dotnet publish --configuration Release --output ./publish -r linux-x64 --self-contained false
      - name: Package as zip
        run: cd publish && zip -r ../publish.zip .
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set build metadata on App Service
        run: |
          az webapp config appsettings set \
            --resource-group thesunrise-rg \
            --name ${{ vars.AZURE_APP_NAME }} \
            --settings \
              BUILD_SHA="${{ github.sha }}" \
              BUILD_VERSION="${{ github.ref_name }}" \
              DEPLOY_TIMESTAMP="${{ github.event.head_commit.timestamp }}"
      - name: Deploy zip to Azure App Service
        run: |
          az webapp deploy \
            --resource-group thesunrise-rg \
            --name ${{ vars.AZURE_APP_NAME }} \
            --src-path ./publish.zip \
            --type zip
      - name: Verify deployment
        run: |
          sleep 15
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://${{ vars.AZURE_APP_NAME }}.azurewebsites.net/health")
          if [ "$status" != "200" ]; then
            echo "Post-deploy health check failed — HTTP $status"
            exit 1
          fi
          echo "Deployment verified (HTTP $status)"

  release-tag:
    name: Create Release Tag
    needs: [frontend-build, backend-deploy]
    if: |
      always() &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.backend-deploy.result == 'success' || needs.backend-deploy.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.backend-deploy.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag
        id: tag
        run: |
          TAG="release-$(date -u '+%Y-%m-%d-%H%M')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Production release $TAG (SHA: ${{ github.sha }})"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged release: $TAG"
