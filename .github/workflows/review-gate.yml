name: Review Gate

on:
  pull_request:
    branches: [review]

concurrency:
  group: review-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'SunriseApi/**'

  frontend-review:
    name: Frontend Review
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - name: Type check
        run: npm run tc
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Dependency security audit
        run: npm audit --audit-level=high

  backend-review:
    name: Backend Review
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SunriseApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        shell: bash
        run: |
          test_projects=$(find . -name "*Tests.csproj" -o -name "*Test.csproj" 2>/dev/null | head -1)
          if [ -n "$test_projects" ]; then
            dotnet test --no-build --configuration Release --verbosity normal
          else
            echo "No test projects found — skipping"
          fi
      - name: Dependency vulnerability scan
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true

  version-sync-check:
    name: Version Sync Check
    needs: [frontend-review, backend-review]
    if: |
      always() &&
      (needs.frontend-review.result == 'success' || needs.frontend-review.result == 'skipped') &&
      (needs.backend-review.result == 'success' || needs.backend-review.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared contract
        shell: bash
        run: |
          echo "Frontend SHA: ${{ github.sha }}"
          echo "Both frontend and backend build successfully — version sync OK"
          # Future: compare OpenAPI spec against frontend API client types
