# Netlify Configuration

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Production builds (main branch only) — embed git SHA
[context.production]
  command = "VITE_BUILD_SHA=$COMMIT_REF npm run build"

# Deploy previews for PRs (into develop or review)
[context.deploy-preview]
  command = "VITE_BUILD_SHA=$COMMIT_REF npm run build"
  [context.deploy-preview.environment]
    VITE_ENV = "preview"

# Branch deploys (develop, review) — never promoted to production
[context.branch-deploy]
  command = "VITE_BUILD_SHA=$COMMIT_REF npm run build"
  [context.branch-deploy.environment]
    VITE_ENV = "branch"

# SPA routing: redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
