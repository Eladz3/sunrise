<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sunrise.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunrise - New Year Goals</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-store');
          var pref = stored ? JSON.parse(stored).state?.preference : null;
          var resolved =
            !pref || pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
